<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="Depoimentos">
        <h1>O que nossos clientes dizem</h1>

        <div class="depoimentos-grid">
            <article class="card">
                <div class="avatar">OL</div>

                <h2>Otávio Lima</h2>
                <p class="cargo">Desenvolvedor</p>

                <p class="texto">
                    "Excelente trabalho, satisfeito!"
                </p>

                <div class="estrelas">
                    ★ ★ ★ ★
                </div>
            </article>

            <article class="card">
                <div class="avatar">RB</div>

                <h2>Rafael Brasil</h2>
                <p class="cargo">Designer</p>

                <p class="texto">
                    "Serviço superou as expectativas, recomendo!"
                </p>

                <div class="estrelas">
                    ★ ★ ★ ★ ★
                </div>
            </article>

            <article class="card">
                <div class="avatar">RP</div>

                <h2>Ramon da Paixão</h2>
                <p class="cargo">Empresário</p>

                <p class="texto">
                    "Profissionais muito competentes!"
                </p>

                <div class="estrelas">
                    ★ ★ ★ ★ ★
                </div>
             </article>

        </div>
    </section>

</body>
</html>
