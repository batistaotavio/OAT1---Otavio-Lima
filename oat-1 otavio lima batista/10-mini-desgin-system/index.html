<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Design System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Mini Design System</h1>
        <p class="descricao">Componentes e estilos da nossa marca.</p>

        <section>
            <h2>Paleta de Cores</h2>

            <div class="cores">
                <div class="cor cor-1">50</div>
                <div class="cor cor-2">200</div>
                <div class="cor cor-3">400</div>
                <div class="cor cor-4">600</div>
                <div class="cor cor-5">900</div>
            </div>
        </section>

        <section>
            <h2>Botôes</h2>

            <div class="botoes">
                <button class="primary">Primary</button>
                <button class="secondary">Secondary</button>
                <button class="ghost">Ghost</button>
                <button class="primary" disabled>Disabled</button>
            </div>
        </section>

    
    </main>

</body>
</html>
